[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "@flarenetwork/=node_modules/@flarenetwork/"
]

[rpc_endpoints]
coston2 = "https://coston2-api.flare.network/ext/C/rpc"
flare = "https://flare-api.flare.network/ext/C/rpc"

[etherscan]
coston2 = { key = "${FLARE_EXPLORER_API_KEY}", url = "https://coston2-explorer.flare.network/api" }
